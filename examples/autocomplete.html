<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Address autocomplete</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .field {
        position: relative;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        font: inherit;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 4px;
        border: 1px solid #ddd;
        border-radius: 8px;
        position: absolute;
        inset-inline: 0;
        background: #fff;
      }
      ul[hidden] {
        display: none;
      }
      li {
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      li[aria-selected='true'],
      li:hover {
        background: #eef6f5;
      }
      output {
        display: block;
        margin-top: 16px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <label for="address">ตำบล / อำเภอ / จังหวัด / รหัสไปรษณีย์</label>
    <div class="field">
      <input id="address" role="combobox" aria-controls="options" aria-expanded="false" autocomplete="off" />
      <ul id="options" role="listbox" hidden></ul>
    </div>
    <output id="picked"></output>

    <script type="module">
      // Point this at your own deployment.
      const API = 'http://localhost:3000'
      const input = document.getElementById('address')
      const list = document.getElementById('options')
      let items = []
      let active = -1
      let timer

      input.addEventListener('input', () => {
        clearTimeout(timer)
        timer = setTimeout(async () => {
          const q = input.value.trim()
          if (!q) return render([])
          const res = await fetch(`${API}/v1/search?type=subDistrict&limit=8&q=${encodeURIComponent(q)}`)
          if (q === input.value.trim()) render((await res.json()).data)
        }, 150)
      })

      input.addEventListener('keydown', (e) => {
        if (list.hidden) return
        if (e.key === 'ArrowDown') move(1)
        else if (e.key === 'ArrowUp') move(-1)
        else if (e.key === 'Enter' && items[active]) pick(items[active])
        else if (e.key === 'Escape') render([])
        else return
        e.preventDefault()
      })

      function render(next) {
        items = next
        list.replaceChildren(
          ...items.map((item, i) => {
            const li = document.createElement('li')
            li.role = 'option'
            li.textContent = item.labelTh
            li.addEventListener('mousedown', (e) => (e.preventDefault(), pick(item)))
            return li
          }),
        )
        list.hidden = items.length === 0
        input.setAttribute('aria-expanded', String(!list.hidden))
        active = -1
        if (items.length) move(1)
      }

      function move(step) {
        active = Math.max(0, Math.min(items.length - 1, active + step))
        ;[...list.children].forEach((li, i) => li.setAttribute('aria-selected', String(i === active)))
      }

      function pick(item) {
        input.value = item.labelTh
        render([])
        const s = item.subDistrict
        document.getElementById('picked').textContent =
          `subDistrictId=${s.id} districtId=${s.districtId} provinceId=${s.provinceId} postcode=${s.postcode}`
      }
    </script>
  </body>
</html>
